<script>/* Cena: add t2,t1,t0 no RISC-V monociclo (LightRISCV). Lê CENA (cena.json inline), expõe renderAt(t). */
'use strict';
const W = 1920, H = 1080, DUR = 45;
const CENA = window.CENA;
const COMP = Object.fromEntries(CENA.componentes.map(c => [c.id, c]));
const WIRE = Object.fromEntries(CENA.fios.map(w => [w.id, w]));
const PASSOS = CENA.passos;
const TRACE = CENA.trace, ADD_IDX = CENA.add_idx, FIB = CENA.fib;

// ---------- utilidades ----------
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeOutBack = t => { const c = 1.70158, d = c + 1; return 1 + d * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const spring = t => 1 - Math.exp(-6 * t) * Math.cos(10 * t);
const hex8 = n => '0x' + (n >>> 0).toString(16).toUpperCase().padStart(8, '0');
const hexS = n => (n >>> 0).toString(16).toUpperCase();
const CLR = { dados: '#4fd1ff', endereco: '#ffb340', controle: '#ff5fd0', clock: '#6cff8a' };
const TXT = '#e8eef7', TXT2 = '#8a97a8';
const FONT = 'Inter, system-ui, sans-serif', MONO = '"JetBrains Mono", "DejaVu Sans Mono", monospace';

// ---------- geometria isométrica ----------
// (cx,cy) = centro da base no chão; w ao longo de x-mundo, d ao longo de y-mundo, h altura
function boxGeom(c) {
  const ax = 0.866, ay = 0.5;
  const A = { x: c.cx - (c.w - c.d) / 2 * ax, y: c.cy - (c.w + c.d) / 2 * ay }; // canto de trás (topo do losango)
  const B = { x: A.x + c.w * ax, y: A.y + c.w * ay };
  const Cc = { x: B.x - c.d * ax, y: B.y + c.d * ay };
  const D = { x: A.x - c.d * ax, y: A.y + c.d * ay };
  const up = p => ({ x: p.x, y: p.y - c.h });
  return { A, B, C: Cc, D, At: up(A), Bt: up(B), Ct: up(Cc), Dt: up(D) };
}
function tone(hue, sat, l, a = 1) { return `hsla(${hue},${sat}%,${l}%,${a})`; }
const HUE = { registrador: 210, somador: 200, mux: 280, memoria: 190, decodificador: 320, imediato: 230, registradores: 215, ula: 175, clock: 130 };

function drawBox(ctx, c, o) {
  // o: {alpha, glow, glowColor, lit}
  const g = boxGeom(c), hue = HUE[c.tipo] || 210;
  const lit = o.lit || 0;
  const sat = lerp(18, 55, lit), lTop = lerp(26, 40, lit), lL = lerp(19, 30, lit), lR = lerp(13, 22, lit);
  ctx.save();
  ctx.globalAlpha = o.alpha;
  if (o.glow > 0.01) { ctx.shadowColor = o.glowColor || tone(hue, 90, 65, 1); ctx.shadowBlur = 40 * o.glow; }
  const poly = (pts, fill) => { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); };
  // sombra no chão
  ctx.save(); ctx.shadowBlur = 0; ctx.globalAlpha = o.alpha * 0.45;
  poly([{ x: g.A.x + 6, y: g.A.y + 8 }, { x: g.B.x + 6, y: g.B.y + 8 }, { x: g.C.x + 6, y: g.C.y + 8 }, { x: g.D.x + 6, y: g.D.y + 8 }], 'rgba(0,0,0,.6)');
  ctx.restore();
  poly([g.D, g.C, g.Ct, g.Dt], tone(hue, sat, lL));   // face esquerda
  poly([g.C, g.B, g.Bt, g.Ct], tone(hue, sat, lR));   // face direita
  poly([g.At, g.Bt, g.Ct, g.Dt], tone(hue, sat, lTop)); // topo
  ctx.shadowBlur = 0;
  // arestas (4º tom: realce)
  ctx.strokeStyle = tone(hue, sat, lerp(48, 70, lit), 0.55); ctx.lineWidth = 1.2;
  ctx.beginPath(); [g.At, g.Bt, g.Ct, g.Dt].forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(g.Ct.x, g.Ct.y); ctx.lineTo(g.C.x, g.C.y); ctx.stroke();
  ctx.strokeStyle = tone(hue, sat, 8, 0.6);
  ctx.beginPath(); ctx.moveTo(g.Dt.x, g.Dt.y); ctx.lineTo(g.D.x, g.D.y); ctx.lineTo(g.C.x, g.C.y); ctx.lineTo(g.B.x, g.B.y); ctx.lineTo(g.Bt.x, g.Bt.y); ctx.stroke();
  ctx.restore();
  return g;
}
// texto no topo da caixa (plano, legível)
function topText(ctx, c, text, dy = 0, size = 18, color = TXT, font = FONT, weight = 600) {
  const g = boxGeom(c); const cx = (g.At.x + g.Ct.x) / 2, cy = (g.At.y + g.Ct.y) / 2 + dy;
  ctx.font = `${weight} ${size}px ${font}`; ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, cx, cy);
}
// grade de células no topo (memórias e banco): retorna centros em tela
function topGrid(c, cols, rows, pad = 10) {
  const g = boxGeom(c); const out = [];
  for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
    const u = (k + .5) / cols, v = (r + .5) / rows; // u ao longo de w (A→B), v ao longo de d (A→D)
    const x = g.At.x + (g.Bt.x - g.At.x) * u + (g.Dt.x - g.At.x) * v;
    const y = g.At.y + (g.Bt.y - g.At.y) * u + (g.Dt.y - g.At.y) * v;
    out.push({ x, y, i: r * cols + k });
  }
  return out;
}

// ---------- fios ----------
for (const w of CENA.fios) {

// ---------- câmera ----------
// [t, x, y, zoom]
const CAM = [

// ---------- linha do tempo ----------
const T = { hookEnd: 3, insertStart: 3, insertEnd: 10, climax: 33.6, endStart: 36, spiralStart: 38.6, credit: 42.6 };

// percurso de pulsos de uma instrução no gancho/fecho: fios de dados, todos ao mesmo tempo (combinacional)

// ---------- desenho principal ----------
let main, mctx, dimL, dctx;

function background(ctx, t) {

function drawScene(t) {

<script>/* Interativo: controles, passos, hover, painel. Modo render (?render=1) esconde tudo. */
(function () {
  const q = new URLSearchParams(location.search); const RENDER = q.get('render') === '1';

  function draw() { window.renderAt(t); if (!RENDER) syncUI(); }

  const $ = s => document.querySelector(s);
  const slider = $('#time'), btnPlay = $('#play'), stepLbl = $('#steplbl'), legend = $('#steplegend'), panel = $('#panel'), tip = $('#tip');

  function syncUI() {

    const i = curPasso(); const p = i >= 0 ? PASSOS[i] : null;
    stepLbl.textContent = p ? `passo ${i + 1}/${PASSOS.length} · ${p.titulo}` : (t < PT[0] ? (t < 3 ? 'gancho: o laço fibo a toda velocidade' : 'a instrução vira bits e campos') : 'fecho: a espiral com os valores da memória');

    const regs = focus ? { t0: 2, t1: 3, t2: x7, s0: 16 } : { t0: row.x5, t1: row.x6, t2: row.x7, s0: row.x8 };
